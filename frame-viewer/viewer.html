<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frame Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a1a; color: #e0e0e0;
    font-family: 'SF Mono', 'Consolas', monospace;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  h1 { font-size: 14px; color: #888; margin-bottom: 16px; letter-spacing: 1px; }
  #frame-wrap { position: relative; width: 100%; max-width: 960px; }
  #frame-img { width: 100%; display: block; border: 1px solid #333; background: #000; }
  #overlay {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,0.65); padding: 6px 12px; border-radius: 4px;
    font-size: 13px; line-height: 1.8; pointer-events: none;
  }
  #overlay .label { color: #888; font-size: 11px; }
  #overlay .value { color: #fff; font-size: 15px; font-weight: bold; }
  #overlay .ts    { color: #4fc3f7; font-size: 13px; }
  #controls { width: 100%; max-width: 960px; margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  #slider { width: 100%; accent-color: #4fc3f7; cursor: pointer; height: 6px; }
  #btn-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button {
    background: #2e2e2e; border: 1px solid #444; color: #e0e0e0;
    padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  button:hover { background: #3a3a3a; }
  #play-btn { min-width: 90px; }
  #jump-wrap, #speed-wrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; }
  #jump-input, #speed-select {
    background: #2e2e2e; border: 1px solid #444; color: #e0e0e0;
    padding: 5px 8px; border-radius: 4px; font-family: inherit; font-size: 13px;
  }
  #jump-input { width: 80px; text-align: center; }
  #hint { margin-top: 12px; font-size: 11px; color: #555; text-align: center; line-height: 2; }
  kbd { background: #2e2e2e; border: 1px solid #444; border-radius: 3px; padding: 1px 6px; font-family: inherit; font-size: 11px; color: #aaa; }
  #missing { margin-top: 12px; font-size: 12px; color: #f66; display: none; }
</style>
</head>
<body>

<h1 id="title">Frame Viewer</h1>

<div id="frame-wrap">
  <img id="frame-img" alt="frame">
  <div id="overlay">
    <div class="label">frame</div>
    <div class="value" id="info-frame">-</div>
    <div class="label" style="margin-top:4px">time</div>
    <div class="ts" id="info-time">-</div>
  </div>
</div>

<div id="controls">
  <input type="range" id="slider" min="1" max="1" value="1">
  <div id="btn-row">
    <button onclick="step(-10)">&laquo;&nbsp;-10</button>
    <button onclick="step(-1)">&lsaquo;&nbsp;Prev</button>
    <button id="play-btn" onclick="togglePlay()">&#9654; Play</button>
    <button onclick="step(1)">Next&nbsp;&rsaquo;</button>
    <button onclick="step(10)">+10&nbsp;&raquo;</button>

    <div id="speed-wrap">
      Speed
      <select id="speed-select" onchange="updateSpeed()">
        <option value="500">2 fps</option>
        <option value="200">5 fps</option>
        <option value="66" selected>15 fps</option>
        <option value="33">30 fps</option>
      </select>
    </div>

    <div id="jump-wrap">
      Go to frame
      <input type="number" id="jump-input" min="1" placeholder="#">
      <button onclick="jumpToFrame()">Go</button>
    </div>
  </div>
</div>

<div id="hint">
  <kbd>&larr;</kbd> prev &nbsp;
  <kbd>&rarr;</kbd> next &nbsp;
  <kbd>Shift+&larr;</kbd> -10 &nbsp;
  <kbd>Shift+&rarr;</kbd> +10 &nbsp;
  <kbd>Space</kbd> play / pause &nbsp;
  <kbd>Home</kbd> / <kbd>End</kbd> first / last
</div>
<div id="missing">Frame file not found. Check the prefix / pad / ext / total parameters (see README).</div>

<script>
  // Everything about the frame set comes from the URL query, so one copy of this file
  // serves any folder:  viewer.html?total=4485&fps=15&prefix=frame_&pad=5&ext=jpg&start=1
  const q = new URLSearchParams(location.search);
  const TOTAL  = parseInt(q.get('total')  || '0');
  const FPS    = parseFloat(q.get('fps')  || '30');
  const PREFIX = q.get('prefix') ?? 'frame_';
  const PAD    = parseInt(q.get('pad')    || '5');
  const EXT    = q.get('ext')    || 'jpg';
  const START  = parseInt(q.get('start')  || '1');
  const LABEL  = q.get('title')  || '';

  let current = 1, playing = false, timer = null, interval = 66;

  const img = document.getElementById('frame-img');
  const slider = document.getElementById('slider');
  const infoFrame = document.getElementById('info-frame');
  const infoTime = document.getElementById('info-time');
  const playBtn = document.getElementById('play-btn');
  const missing = document.getElementById('missing');

  document.getElementById('title').textContent =
    ['Frame Viewer', LABEL, FPS + ' fps', TOTAL ? TOTAL + ' frames' : 'set ?total='].filter(Boolean).join('  |  ');
  slider.max = TOTAL || 1;
  document.getElementById('jump-input').max = TOTAL || 1;

  function pad(n, len) { return String(n).padStart(len, '0'); }

  function toTimestamp(frameNum) {
    const totalMs = (frameNum - 1) / FPS * 1000;
    const min = Math.floor(totalMs / 60000);
    const sec = Math.floor((totalMs % 60000) / 1000);
    const ms = Math.floor(totalMs % 1000);
    return `${pad(min, 2)}:${pad(sec, 2)}.${pad(ms, 3)}`;
  }

  function goTo(n) {
    current = Math.max(1, Math.min(TOTAL || 1, n));
    img.src = PREFIX + pad(current - 1 + START, PAD) + '.' + EXT;
    slider.value = current;
    infoFrame.textContent = current + ' / ' + TOTAL;
    infoTime.textContent = toTimestamp(current);
  }

  function step(delta) { goTo(current + delta); }

  function togglePlay() {
    playing = !playing;
    playBtn.innerHTML = playing ? '&#10074;&#10074; Pause' : '&#9654; Play';
    if (playing) {
      timer = setInterval(() => { if (current >= TOTAL) { togglePlay(); return; } step(1); }, interval);
    } else {
      clearInterval(timer);
    }
  }

  function updateSpeed() {
    interval = parseInt(document.getElementById('speed-select').value);
    if (playing) { togglePlay(); togglePlay(); }
  }

  function jumpToFrame() {
    const val = parseInt(document.getElementById('jump-input').value);
    if (!isNaN(val)) goTo(val);
  }

  img.addEventListener('error', () => { missing.style.display = 'block'; });
  img.addEventListener('load', () => { missing.style.display = 'none'; });
  slider.addEventListener('input', () => goTo(parseInt(slider.value)));
  document.getElementById('jump-input').addEventListener('keydown', e => { if (e.key === 'Enter') jumpToFrame(); });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft')  { e.preventDefault(); step(e.shiftKey ? -10 : -1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); step(e.shiftKey ? 10 : 1); }
    if (e.key === ' ')          { e.preventDefault(); togglePlay(); }
    if (e.key === 'Home')       { e.preventDefault(); goTo(1); }
    if (e.key === 'End')        { e.preventDefault(); goTo(TOTAL); }
  });

  goTo(1);
</script>
</body>
</html>
